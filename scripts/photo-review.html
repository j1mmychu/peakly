<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Peakly — Photo Review</title>
<style>
  @font-face {
    font-family: 'Plus Jakarta Sans';
    src: local('Plus Jakarta Sans');
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overscroll-behavior: none;
    background: #141414; color: #f5f5f5;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ── top bar: progress + counts ─────────────────────────────────── */
  #topbar {
    flex: 0 0 auto; padding: 14px 20px 12px; display: flex; align-items: center; gap: 16px;
    background: #141414; z-index: 20;
  }
  #brand { font-weight: 800; font-size: 15px; letter-spacing: -0.3px; color: #fff; white-space: nowrap; }
  #brand span { color: #38bdf8; }
  #progress-track {
    flex: 1; height: 4px; border-radius: 2px; background: #2a2a2a; overflow: hidden; position: relative;
  }
  #progress-fill {
    height: 100%; background: linear-gradient(90deg,#0284c7,#38bdf8); border-radius: 2px;
    transition: width 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }
  #counter { font-size: 12.5px; color: #999; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #tally { display: flex; gap: 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .tally-good { color: #34d399; } .tally-bad { color: #f87171; } .tally-skip { color: #fbbf24; }

  /* ── stage: the photo ───────────────────────────────────────────── */
  #stage {
    flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
    min-height: 0; background: #0a0a0a;
  }
  #photo-wrap { position: relative; width: 100%; height: 100%; }
  #photo {
    width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transition: opacity 0.18s ease;
  }
  #photo.loaded { opacity: 1; }
  #photo-shade {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.15) 38%, transparent 62%);
  }
  #flash {
    position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.15s ease;
  }
  #flash.good { background: rgba(52,211,153,0.28); }
  #flash.bad { background: rgba(248,113,113,0.28); }
  #flash.skip { background: rgba(251,191,36,0.24); }
  #flash.show { opacity: 1; }

  /* tap zones (mobile / mouse alt) */
  #tapzones { position: absolute; inset: 0; display: flex; z-index: 5; }
  #tapzones div { flex: 1; }

  /* ── card meta, bottom-left over the shade ──────────────────────── */
  #meta { position: absolute; left: 22px; right: 22px; bottom: 108px; z-index: 6; pointer-events: none; }
  #cat-pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800;
    letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 10px; border-radius: 20px;
    background: rgba(255,255,255,0.14); backdrop-filter: blur(6px); margin-bottom: 10px;
  }
  #title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; margin-bottom: 4px;
    text-wrap: balance; text-shadow: 0 2px 12px rgba(0,0,0,0.4); }
  #loc { font-size: 14px; color: rgba(255,255,255,0.75); font-weight: 500; }
  #idx-of-total { position: absolute; top: 0; right: 0; font-size: 11px; color: rgba(255,255,255,0.5);
    font-variant-numeric: tabular-nums; font-weight: 600; }

  /* ── bottom controls ─────────────────────────────────────────────── */
  #controls {
    flex: 0 0 auto; z-index: 20; background: #141414;
    padding: 14px 20px calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 10px;
  }
  button.act {
    flex: 1; border: none; border-radius: 16px; padding: 15px 0; font-family: inherit;
    font-size: 14.5px; font-weight: 800; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; gap: 2px; transition: transform 0.08s ease, filter 0.15s ease; color: #fff;
  }
  button.act:active { transform: scale(0.96); }
  button.act .key { font-size: 10px; font-weight: 700; opacity: 0.55; letter-spacing: 0.04em; }
  #btn-bad  { background: #2a1414; color: #f87171; }
  #btn-skip { background: #221c0e; color: #fbbf24; flex: 0 0 84px; }
  #btn-good { background: #0f2419; color: #34d399; }
  #btn-back {
    flex: 0 0 44px; background: #1e1e1e; color: #888; border: none; border-radius: 14px;
    font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #btn-back:active { transform: scale(0.94); }
  #btn-back:disabled { opacity: 0.3; cursor: default; }

  /* ── done state ──────────────────────────────────────────────────── */
  #done {
    display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px; gap: 18px;
  }
  #done.show { display: flex; }
  #done h1 { font-size: 30px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
  #done p { color: #999; font-size: 14px; margin: 0; max-width: 380px; line-height: 1.5; }
  #export-box { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
  .bigbtn {
    border: none; border-radius: 14px; padding: 13px 22px; font-family: inherit; font-size: 14px;
    font-weight: 800; cursor: pointer; color: #fff;
  }
  #btn-export { background: linear-gradient(135deg,#0284c7,#38bdf8); }
  #btn-restart-flagged { background: #2a1414; color: #f87171; }
  #btn-reset { background: #1e1e1e; color: #888; }
  #copied-note { font-size: 12px; color: #34d399; font-weight: 700; opacity: 0; transition: opacity 0.2s; }
  #copied-note.show { opacity: 1; }

  /* ── flagged review list (shown after export, or via review link) ── */
  #flaglist { max-height: 40vh; overflow-y: auto; width: 100%; max-width: 480px; text-align: left;
    background: #1a1a1a; border-radius: 14px; padding: 4px; margin-top: 8px; }
  #flaglist .row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; }
  #flaglist .row:hover { background: #222; }
  #flaglist img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex: 0 0 auto; }
  #flaglist .txt { flex: 1; min-width: 0; }
  #flaglist .t { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #flaglist .l { font-size: 11px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #hint { position: fixed; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 10px; color: #444;
    pointer-events: none; z-index: 1; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
</style>
</head>
<body>

  <div id="topbar">
    <div id="brand">peakly<span>·</span>photos</div>
    <div id="progress-track"><div id="progress-fill" style="width:0%"></div></div>
    <div id="tally">
      <span class="tally-good" id="t-good">0</span>
      <span class="tally-bad" id="t-bad">0</span>
      <span class="tally-skip" id="t-skip">0</span>
    </div>
    <div id="counter">0 / 0</div>
  </div>

  <div id="stage">
    <div id="photo-wrap">
      <img id="photo" alt="" />
      <div id="photo-shade"></div>
      <div id="flash"></div>
      <div id="tapzones">
        <div id="zone-bad" title="Flag as wrong"></div>
        <div id="zone-good" title="Looks right"></div>
      </div>
      <div id="meta">
        <span id="cat-pill">🏔️ Skiing</span>
        <div id="title">Loading…</div>
        <div id="loc"></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <button id="btn-back" disabled title="Back (Backspace)">←</button>
    <button class="act" id="btn-bad" title="Wrong photo (←)">
      <span>✕ Flag</span><span class="key">←  A</span>
    </button>
    <button class="act" id="btn-skip" title="Not sure (↓)">
      <span>? Skip</span><span class="key">↓  S</span>
    </button>
    <button class="act" id="btn-good" title="Looks right (→)">
      <span>✓ Good</span><span class="key">→  D</span>
    </button>
  </div>

  <div id="done">
    <h1 id="done-title">All 374 reviewed 🎉</h1>
    <p id="done-sub">Export the flagged list below and hand it to the photo-fix pipeline (<code>scripts/photos-fetch.mjs</code>).</p>
    <div id="export-box">
      <button class="bigbtn" id="btn-export">Copy flagged list</button>
      <button class="bigbtn" id="btn-download">Download JSON</button>
      <button class="bigbtn" id="btn-restart-flagged" style="display:none">Re-review flagged only</button>
      <button class="bigbtn" id="btn-reset">Reset all progress</button>
    </div>
    <span id="copied-note">Copied to clipboard ✓</span>
    <div id="flaglist"></div>
  </div>

  <div id="hint">← flag &nbsp;·&nbsp; → good &nbsp;·&nbsp; ↓ skip &nbsp;·&nbsp; backspace = back</div>

},{"id":"grace-bay-turks","title":"Grace Bay Beach","location":"Providenciales, Turks & Caicos","category":"beach","photo":"https://images.unsplash.com/photo-1414609245224-aea9a7afaef8?w=800&h=600&fit=crop"},{"id":"south-beach-miami","title":"South Beach","location":"Miami Beach, Florida, USA","category":"beach","photo":"https://images.unsplash.com/photo-1516690561799-46d8f74f9abf?w=800&h=600&fit=crop"},{"id":"cancun-beach","title":"Cancún Beach","location":"Cancún, Quintana Roo, Mexico","category":"beach","photo":"https://images.unsplash.com/photo-1527004013197-933c4bb611b3?w=800&h=600&fit=crop&fp-x=0.5&fp-y=0.4"},{"id":"arugam-bay-sl","title":"Arugam Bay","location":"Eastern Province, Sri Lanka","category":"beach","photo":"https://images.unsplash.com/photo-1566452348683-af04c7f8b0e8?w=800&h=600&fit=crop"},{"id":"essaouira-beach","title":"Essaouira Beach","location":"Essaouira, Morocco","category":"beach","photo":"https://images.unsplash.com/photo-1548438294-1ad5d5f4f063?w=800&h=600&fit=crop"},{"id":"les-deux-alpes-fr","title":"Les Deux Alpes","location":"Isère, France","category":"skiing","photo":"https://images.unsplash.com/photo-1583119022894-919a68a3d0e3?w=800&h=600&fit=crop&fp-x=0.5&fp-y=0.4"},{"id":"saas-fee-ch","title":"Saas-Fee","location":"Valais, Switzerland","category":"skiing","photo":"https://images.unsplash.com/photo-1551698618-1dfe5d97d256?w=800&h=600&fit=crop&fp-x=0.5&fp-y=0.4"},{"id":"st-moritz-ch","title":"St. Moritz","location":"Graubünden, Switzerland","category":"skiing","photo":"https://images.unsplash.com/photo-1606787364406-a3cdf06c6d0c?w=800&h=600&fit=crop&fp-x=0.55&fp-y=0.45"},{"id":"las-teresitas-tfe","title":"Las Teresitas Beach","location":"Santa Cruz de Tenerife, Canary Islands","category":"beach","photo":"https://images.unsplash.com/photo-1566452348683-af04c7f8b0e8?w=800&h=600&fit=crop"},{"id":"elafonissi-beach-chq","title":"Elafonissi Beach","location":"Chania, Crete, Greece","category":"beach","photo":"https://images.unsplash.com/photo-1560903510-6c52aadbfd44?w=800&h=600&fit=crop&fp-x=0.5&fp-y=0.4"},{"id":"beach_poipu","title":"Poipu Beach","location":"Kauai, Hawaii","category":"beach","photo":"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&h=600&fit=crop"}];

const CAT_META = {
  skiing: { icon: "🏔️", label: "Skiing" },
  beach:  { icon: "🏖️", label: "Beach"  },
};

const LS_KEY = "peakly_photo_review_v1";
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return { decisions: {}, order: null };
}
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch {}
}

let state = loadState();
// Stable shuffle order persisted so resuming doesn't reshuffle mid-review.
// Reviewing in a fixed venue order (not shuffled) keeps ski/beach clusters
// together, which actually makes spotting mismatches EASIER (eye stays
// calibrated to "does this look like the Alps" for a run of ski cards).
if (!state.order || state.order.length !== VENUES.length) {
  state.order = VENUES.map((_, i) => i);
  saveState();
}

let queue = state.order.map(i => VENUES[i]);
let pos = 0;
// Jump to the first not-yet-decided venue on load (resume).
while (pos < queue.length && state.decisions[queue[pos].id]) pos++;

let history = []; // stack of previous positions for Back

const els = {
  photo: document.getElementById('photo'),
  flash: document.getElementById('flash'),
  title: document.getElementById('title'),
  loc: document.getElementById('loc'),
  catPill: document.getElementById('cat-pill'),
  counter: document.getElementById('counter'),
  progressFill: document.getElementById('progress-fill'),
  tGood: document.getElementById('t-good'),
  tBad: document.getElementById('t-bad'),
  tSkip: document.getElementById('t-skip'),
  stage: document.getElementById('stage'),
  controls: document.getElementById('controls'),
  done: document.getElementById('done'),
  doneTitle: document.getElementById('done-title'),
  btnBack: document.getElementById('btn-back'),
  btnGood: document.getElementById('btn-good'),
  btnBad: document.getElementById('btn-bad'),
  btnSkip: document.getElementById('btn-skip'),
  zoneGood: document.getElementById('zone-good'),
  zoneBad: document.getElementById('zone-bad'),
  flaglist: document.getElementById('flaglist'),
  btnExport: document.getElementById('btn-export'),
  btnDownload: document.getElementById('btn-download'),
  btnReset: document.getElementById('btn-reset'),
  btnRestartFlagged: document.getElementById('btn-restart-flagged'),
  copiedNote: document.getElementById('copied-note'),
};

const preloaded = new Set();
function preload(idx) {
  if (idx < 0 || idx >= queue.length) return;
  const v = queue[idx];
  if (preloaded.has(v.id)) return;
  preloaded.add(v.id);
  const img = new Image();
  img.src = v.photo;
}

function tallyCounts() {
  let good = 0, bad = 0, skip = 0;
  for (const v of VENUES) {
    const d = state.decisions[v.id];
    if (d === 'good') good++;
    else if (d === 'bad') bad++;
    else if (d === 'skip') skip++;
  }
  return { good, bad, skip };
}

function updateTopbar() {
  const { good, bad, skip } = tallyCounts();
  const decided = good + bad + skip;
  els.tGood.textContent = good;
  els.tBad.textContent = bad;
  els.tSkip.textContent = skip;
  els.counter.textContent = `${decided} / ${VENUES.length}`;
  els.progressFill.style.width = (decided / VENUES.length * 100).toFixed(1) + '%';
}

function render() {
  updateTopbar();
  els.btnBack.disabled = history.length === 0;

  if (pos >= queue.length) {
    showDone();
    return;
  }
  els.done.classList.remove('show');
  els.stage.style.display = '';
  els.controls.style.display = '';

  const v = queue[pos];
  els.photo.classList.remove('loaded');
  els.photo.src = v.photo;
  els.photo.onload = () => els.photo.classList.add('loaded');
  els.title.textContent = v.title;
  els.loc.textContent = v.location;
  const cm = CAT_META[v.category] || { icon: "📍", label: v.category };
  els.catPill.textContent = `${cm.icon} ${cm.label}`;

  preload(pos + 1);
  preload(pos + 2);
  preload(pos + 3);
}

function flash(kind) {
  els.flash.className = kind + ' show';
  setTimeout(() => { els.flash.classList.remove('show'); }, 160);
}

function decide(kind) {
  if (pos >= queue.length) return;
  const v = queue[pos];
  state.decisions[v.id] = kind;
  saveState();
  flash(kind);
  history.push(pos);
  pos++;
  render();
}

function goBack() {
  if (!history.length) return;
  pos = history.pop();
  render();
}

function showDone() {
  els.stage.style.display = 'none';
  els.controls.style.display = 'none';
  els.done.classList.add('show');
  const { bad } = tallyCounts();
  els.doneTitle.textContent = bad
    ? `All ${VENUES.length} reviewed — ${bad} flagged`
    : `All ${VENUES.length} reviewed — nothing flagged 🎉`;
  els.btnRestartFlagged.style.display = bad ? '' : 'none';
  renderFlagList();
}

function flaggedVenues() {
  return VENUES.filter(v => state.decisions[v.id] === 'bad');
}

function renderFlagList() {
  const bad = flaggedVenues();
  if (!bad.length) { els.flaglist.innerHTML = ''; return; }
  els.flaglist.innerHTML = bad.map(v => `
    <div class="row">
      <img src="${v.photo}" loading="lazy" />
      <div class="txt">
        <div class="t">${v.title}</div>
        <div class="l">${v.location} · ${v.id}</div>
      </div>
    </div>
  `).join('');
}

function flaggedPayload() {
  return JSON.stringify(flaggedVenues().map(v => ({
    id: v.id, title: v.title, location: v.location, category: v.category, photo: v.photo
  })), null, 2);
}

els.btnGood.onclick = () => decide('good');
els.btnBad.onclick = () => decide('bad');
els.btnSkip.onclick = () => decide('skip');
els.btnBack.onclick = goBack;
els.zoneGood.onclick = () => decide('good');
els.zoneBad.onclick = () => decide('bad');

els.btnExport.onclick = async () => {
  const text = flaggedPayload();
  try {
    await navigator.clipboard.writeText(text);
    els.copiedNote.classList.add('show');
    setTimeout(() => els.copiedNote.classList.remove('show'), 1600);
  } catch {
    alert('Clipboard blocked — use Download JSON instead.');
  }
};
els.btnDownload.onclick = () => {
  const blob = new Blob([flaggedPayload()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'peakly-flagged-photos.json';
  a.click();
  URL.revokeObjectURL(url);
};
els.btnRestartFlagged.onclick = () => {
  const bad = flaggedVenues();
  queue = bad;
  pos = 0;
  history = [];
  render();
};
els.btnReset.onclick = () => {
  if (!confirm('Clear all review progress? This cannot be undone.')) return;
  state = { decisions: {}, order: VENUES.map((_, i) => i) };
  saveState();
  queue = state.order.map(i => VENUES[i]);
  pos = 0;
  history = [];
  render();
};

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  switch (e.key) {
    case 'ArrowRight': case 'd': case 'D': decide('good'); break;
    case 'ArrowLeft':  case 'a': case 'A': decide('bad'); break;
    case 'ArrowDown':  case 's': case 'S': decide('skip'); break;
    case 'Backspace':  goBack(); break;
  }
});

render();
</script>
</body>
</html>
