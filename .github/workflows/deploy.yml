name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Queue deploys. Do not cancel an in-flight Pages deployment.
# cancel-in-progress: true aborts GitHub's "updating_pages" step, and the
# next run then sits on that status until the 10-minute timeout
# (failures on 2026-09-21 and 2026-10-14).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      - name: Build web bundle (pre-transpile + minify app.jsx → dist/)
        run: node scripts/build-web.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Ship only the built, optimized bundle — not the repo root.
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # 2026-10-08: the artifact upload reported success, then deploy-pages
      # immediately said it found 0 artifacts. One delayed retry covers that race.
      - name: Pause before Pages retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Retry Pages deploy
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Require a successful deploy
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome != 'success'
        run: exit 1
